name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Daily rebuild so events move from Upcoming to Past without a commit.
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    # TODO(officers): remove this once src/config.ts has the real Discord/social
    # URLs, so the placeholder guard can protect production again.
    env:
      ALLOW_PLACEHOLDERS: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build with Astro
        uses: withastro/action@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
